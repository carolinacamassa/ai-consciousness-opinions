name: Update site

# Every 3 hours: search the Community Archive for new tweets, grade them, rebuild the
# site and publish it to GitHub Pages. The SQLite database is kept between runs as a
# single gzipped file on the `data` branch, which each run overwrites.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "Start a new database if the data branch doesn't exist (searches from START_DATE)"
        type: boolean
        default: false

concurrency:
  group: update-site
  cancel-in-progress: false  # never kill a run halfway through paid grading

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # to save the database on the data branch
      pages: read      # to read the custom domain, if one is set
    env:
      FRESH_START: ${{ inputs.fresh_start || false }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Find the site's address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # With a custom domain (Settings > Pages) the site is served from the domain's root;
          # without one, from https://<owner>.github.io/<repo>/. The build needs to know for its links.
          domain=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""')
          if [ -n "$domain" ]; then
            echo "ACO_SITE_URL=https://$domain" >> "$GITHUB_ENV"
            echo "ACO_BASE=/" >> "$GITHUB_ENV"
          else
            echo "ACO_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "ACO_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
          echo "Building for ${domain:-${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"

      - name: Restore database
        id: restore
        run: |
          mkdir -p data
          set +e; git ls-remote --exit-code --heads origin data > /dev/null; found=$?; set -e
          if [ "$found" -eq 0 ]; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:aco.sqlite.gz | gunzip > data/aco.sqlite
            echo "restored=true" >> "$GITHUB_OUTPUT"
          elif [ "$found" -eq 2 ] && [ "$FRESH_START" = "true" ]; then
            echo "No data branch yet: starting a fresh database."
            echo "restored=false" >> "$GITHUB_OUTPUT"
          else
            # Without the saved database the run would publish a near-empty site and then
            # overwrite the data branch, so stop instead.
            echo "::error::Could not restore the database from the data branch (git ls-remote exit $found). To start from scratch, run this workflow manually with fresh_start."
            exit 1
          fi

      - name: Update
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add an OPENROUTER_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Also backfills from START_DATE when that is earlier than anything searched so far.
          uv run aco update

      - name: Save database
        # Also after a failed update, so grades already paid for are kept; but never when
        # the restore failed, which would replace the saved database with an empty one.
        if: always() && steps.restore.outputs.restored != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The data branch is public: keep only the tweets the site shows or uses as context.
          uv run aco prune
          uv run python -c "import sqlite3; c = sqlite3.connect('data/aco.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.close()"
          tmp=$(mktemp -d)
          gzip -9 -c data/aco.sqlite > "$tmp/aco.sqlite.gz"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aco.sqlite.gz
          git commit -q -m "Database after run $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
