<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block meta %}{% endblock %}
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}What people on X say about AI consciousness and the moral status of AI systems, sorted by stance. Built from the Community Archive.{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="{{ base }}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://pbs.twimg.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
{% if umami_id %}<script defer src="{{ umami_script }}" data-website-id="{{ umami_id }}"></script>{% endif %}
<style>
/* Lab notebook: graph paper, navy ink, red pencil, highlighter. */
:root {
  color-scheme: light;
  --paper: #F6F8FA;
  --grid: #DDE5EC;
  --card: #FFFFFF;
  --ink: #1B2A4E;
  --ink-2: #26334F;
  --text-2: #3E4A66;
  --muted: #5A667D;
  --rule: #C9D3DD;
  --accent: #B83224;
  --mark: #FFEE99;
  --live: #1F8A4C;
  --sans: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 13.5px/1.6 var(--mono);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
a { color: var(--ink); }
a:hover { color: var(--accent); }
img { display: block; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
button { font: 500 13px var(--mono); color: var(--ink); background: var(--card); border: 1.5px solid var(--ink); padding: 10px 16px; min-height: 44px; cursor: pointer; }
button:hover { color: var(--accent); }
button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Masthead */
.masthead { padding: 28px 0 32px; }
.topnav { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
.head-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 28px 40px; margin-top: 20px; }
.head-main { padding-top: 12px; }
.head-main { flex: 999 1 520px; min-width: 0; }
.kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.brand { margin: 8px 0 0; font: 700 clamp(40px, 6.6vw, 84px)/0.95 var(--sans); letter-spacing: -0.01em; text-transform: uppercase; }
.dek { margin: 16px 0 0; font-size: 15px; color: var(--text-2); max-width: 46em; }

/* Signs-of-life panel */
.panel { flex: 1 1 340px; min-width: 0; position: relative; background: var(--card); border: 1.5px solid var(--ink); padding: 14px 16px; }
.panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 16px; font-size: 13px; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.panel h3 { margin: 14px 0 4px; padding-top: 10px; border-top: 1px dashed var(--ink); font: 600 11.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.panel .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11.5px; color: var(--text-2); margin-bottom: 2px; }
.panel .legend span { display: inline-flex; align-items: center; gap: 6px; }
.panel .legend i { width: 10px; height: 10px; background: var(--c); display: inline-block; }
.panel .note { margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.panel .raw { display: block; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--ink); font-size: 13px; }
.viz { display: block; width: 100%; height: auto; overflow: visible; }
.viz .tick { font: 10px var(--mono); fill: var(--muted); }
.viz .end { font: 600 11px var(--mono); fill: var(--ink); }
.viz .seg:hover, .viz .seg:focus { fill: rgba(27, 42, 78, 0.06); outline: none; }
.viz:focus { outline: none; }
.viz:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.viz-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--card); border: 1.5px solid var(--ink); padding: 4px 8px; font-size: 11.5px; white-space: nowrap; }
.viz-tip b { font-weight: 600; }
.viz-table summary { cursor: pointer; font-size: 12px; color: var(--text-2); margin-top: 8px; }
.viz-table table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.viz-table th, .viz-table td { text-align: right; padding: 2px 4px; border-bottom: 1px dashed var(--rule); }
.viz-table th:first-child, .viz-table td:first-child { text-align: left; }
.viz-table th { font-weight: 600; color: var(--muted); }

/* Sections */
section { margin-top: 56px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; }
.sec-n { font-size: 14px; font-weight: 600; color: var(--accent); }
.sec-head h2 { margin: 0; font: 600 30px/1.1 var(--sans); }
.sec-meta { font-size: 12.5px; color: var(--muted); }
.sec-tools { margin-left: auto; display: flex; gap: 6px; }
.more-row { margin-top: 20px; }

/* Stance chips: identity is the colored square and border; the text stays ink */
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1.6 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none; border: 1.5px solid var(--c); color: var(--ink); background: var(--card); padding: 1px 7px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; background: var(--c); flex: none; }
a.chip:hover { color: var(--accent); }
.swatch { width: 10px; height: 10px; flex: none; display: inline-block; border: 1.5px solid var(--ink); background: var(--c); }

/* Stance columns */
.stance-tabs { display: none; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 24px; align-items: start; }
.col { background: var(--card); border: 1.5px solid var(--ink); display: flex; flex-direction: column; min-width: 0; }
.col-strip { display: flex; justify-content: space-between; gap: 12px; padding: 7px 14px; border-bottom: 1px dashed var(--ink); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.col-head { padding: 14px 16px; border-bottom: 1px dashed var(--ink); }
.col-head h3 { margin: 0; display: flex; align-items: center; gap: 10px; font: 600 25px/1.15 var(--sans); }
.col-head h3 a { text-decoration: none; }
.col-def { margin: 8px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--text-2); }
.col-foot { padding: 12px 16px; font-size: 12.5px; }

/* Compact entry (columns) */
.entry { padding: 14px 16px; border-bottom: 1px dashed var(--ink); }
.entry .stamp { font-size: 12px; font-weight: 600; color: var(--accent); }
.who { margin-top: 4px; font-size: 13px; overflow-wrap: anywhere; }
.who b { font-weight: 600; }
.who .handle { color: var(--muted); }
.entry .txt { margin: 6px 0 0; font-size: 13px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.txt a { color: var(--ink); }
.entry-notes { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }

/* Full card (stance, person and notable lists) */
.card { background: var(--card); border: 1.5px solid var(--ink); padding: 16px; min-width: 0; display: flex; flex-direction: column; }
.list .card + .card { margin-top: 20px; }
.card-strip { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; font-size: 12px; }
.card-strip .stamp { font-weight: 600; color: var(--accent); }
.card .gist { margin: 10px 0 0; font: 500 15.5px/1.4 var(--sans); }
.card .gist mark { background: var(--mark); color: var(--ink); padding: 0 3px; }
.card .txt { margin: 10px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.list .card > .txt, .notable .card > .txt { display: -webkit-box; -webkit-line-clamp: 14; -webkit-box-orient: vertical; overflow: hidden; }
.notable .card > .txt { -webkit-line-clamp: 8; }
.card.expanded > .txt { -webkit-line-clamp: unset !important; display: block !important; }
.readmore { font: 500 12.5px var(--mono); color: var(--ink); background: none; border: 0; padding: 4px 0 0; min-height: 0; text-decoration: underline; cursor: pointer; align-self: flex-start; }
.media { display: grid; gap: 4px; margin: 12px 0 0; max-width: 520px; }
.media.n2, .media.n3, .media.n4 { grid-template-columns: 1fr 1fr; }
.media a { position: relative; display: block; border: 1px solid var(--ink); background: var(--paper); }
.media img { width: 100%; height: 100%; max-height: 380px; object-fit: cover; }
.media.n1 img { height: auto; }
.media video { display: block; width: 100%; height: auto; max-height: 460px; background: #000; border: 1px solid var(--ink); }
.media .play { position: absolute; inset: 0; display: grid; place-items: center; }
.media .play::after { content: ""; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; filter: drop-shadow(0 1px 3px #0009); }
.media-cap { margin-top: 6px; font-size: 11.5px; color: var(--muted); font-style: italic; }
.quote { margin-top: 12px; border: 1px dashed var(--ink); padding: 10px 12px; }
.quote .label { font-size: 11.5px; color: var(--muted); }
.quote .txt { margin-top: 4px; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.quote .media { max-width: 360px; }
details.thread, details.replies { margin-top: 12px; }
details.thread summary, details.replies summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); list-style: none; }
details summary::-webkit-details-marker { display: none; }
details.thread summary::before, details.replies summary::before { content: "+ "; }
details[open].thread summary::before, details[open].replies summary::before { content: "− "; }
.thread-tweet { border-left: 1.5px solid var(--ink); padding: 2px 0 2px 12px; margin-top: 10px; }
.thread-tweet .txt { margin: 0; }
.reply { padding: 10px 0 0; margin-top: 10px; border-top: 1px dashed var(--rule); }
.reply .txt { margin: 4px 0 0; font-size: 13px; }
.card-foot { margin-top: auto; padding-top: 14px; }
.card-foot > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--ink); font-size: 12px; }
.dbg { display: none; font: 500 11px/1.3 var(--mono); color: #6b4a00; background: var(--mark); padding: 2px 6px; }
.debug .dbg { display: inline-block; }

/* Notable grid */
.notable { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 24px; align-items: start; }

/* Ruled table (people) */
.ruled { margin-top: 24px; background: var(--card); border: 1.5px solid var(--ink); overflow-x: auto; }
.ruled .inner { min-width: 520px; font-size: 13px; }
.ruled .row { display: grid; grid-template-columns: 48px minmax(0, 3fr) 110px minmax(0, 2fr); gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px dashed var(--rule); }
.ruled .row.th { border-bottom: 1px dashed var(--ink); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ruled .row a { text-decoration: none; }
.bar { display: block; height: 8px; border: 1px solid var(--ink); background: var(--card); }
.bar span { display: block; height: 100%; background: var(--ink); }

/* Page heads (stance, person, about) */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 24px; font-size: 13px; }
.crumbs .home { font: 600 17px var(--sans); text-transform: uppercase; text-decoration: none; margin-right: 8px; }
.page-head { padding: 32px 0 28px; border-bottom: 1.5px solid var(--ink); }
.page-head h1 { margin: 8px 0 0; font: 700 clamp(36px, 5.6vw, 64px)/0.98 var(--sans); text-transform: uppercase; }
.page-head .def { margin: 12px 0 0; font-size: 14px; color: var(--text-2); max-width: 46em; }
.summary { margin-top: 24px; background: var(--card); border: 1.5px solid var(--ink); padding: 16px; max-width: 820px; }
.summary .one { margin: 0; font: 500 19px/1.4 var(--sans); }
.summary .one mark { background: var(--mark); color: var(--ink); padding: 0 3px; font-weight: 700; }
.summary .agg { margin: 12px 0 0; font-size: 13px; color: var(--text-2); }
.summary .agg b { color: var(--accent); font-weight: 600; }
.summary .portrait { margin: 12px 0 0; font-size: 13.5px; line-height: 1.65; }
.summary .when { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--ink); font-size: 11.5px; color: var(--muted); }
.toolbar { max-width: 820px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; margin-bottom: 20px; }
.toolbar h2 { margin: 0; font: 600 30px/1.1 var(--sans); }
.list { max-width: 820px; }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 100; background: rgba(27, 42, 78, .9); display: flex; align-items: center; justify-content: center; }
.lb img { max-width: calc(100vw - 120px); max-height: calc(100vh - 80px); object-fit: contain; border: 1.5px solid #fff; cursor: zoom-out; }
.lb button { position: absolute; background: var(--card); color: var(--ink); width: 44px; height: 44px; padding: 0; font-size: 20px; }
.lb .x { top: 18px; right: 18px; }
.lb .prev { left: 18px; } .lb .next { right: 18px; }
.lb .count { position: absolute; bottom: 18px; color: #fff; font-size: 12.5px; }

footer { margin-top: 56px; padding: 16px 0 56px; border-top: 1.5px solid var(--ink); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 12.5px; color: var(--text-2); }

{% block style %}{% endblock %}

@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .stance-tabs { display: flex; }
  .cols .col.tab-off { display: none; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .sec-head h2, .toolbar h2 { font-size: 26px; }
  .sec-tools { margin-left: 0; }
  .lb img { max-width: 100vw; max-height: calc(100vh - 120px); }
  .lb .prev, .lb .next { top: auto; bottom: 18px; }
}
</style>
</head>
<body>
<div class="wrap">
{% block body %}{% endblock %}
<footer>
  <span><a href="{{ base }}about/">about</a> · <a href="{{ github }}" target="_blank" rel="noopener">github</a> · <a href="{{ base }}llms.txt">llms.txt</a></span>
  <span>built on <a href="{{ upstream }}" target="_blank" rel="noopener">Model Behavior Reports</a> by Alexandre Variengien · data from the <a href="https://www.community-archive.org" target="_blank" rel="noopener">Community Archive</a> — end of log</span>
</footer>
</div>
<script>
(function () {
  // "Read more" on any card whose text is clipped. Clipping can only be measured once
  // visible, so re-check when a <details> opens.
  window.acoReadMore = function (root) {
    (root || document).querySelectorAll(".card:not(.expanded) > .txt").forEach(function (el) {
      if (el.nextElementSibling && el.nextElementSibling.classList.contains("readmore")) return;
      if (el.scrollHeight > el.clientHeight + 2) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "readmore"; b.textContent = "read more";
        b.addEventListener("click", function () { el.closest(".card").classList.add("expanded"); b.remove(); });
        el.insertAdjacentElement("afterend", b);
      }
    });
  };
  window.acoReadMore();
  document.addEventListener("toggle", function (e) { if (e.target.open) window.acoReadMore(e.target); }, true);
  addEventListener("load", function () { window.acoReadMore(); });
  // ?debug=1 shows the grades; keep it on across internal links.
  if (/[?&]debug=1/.test(location.search)) {
    document.documentElement.classList.add("debug");
    document.querySelectorAll('a[href^="{{ base }}"]').forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href") + "?debug=1");
    });
  }
  // Lightbox: photos open over the page; arrows browse the other photos of the same tweet.
  var lb = null, set = [], at = 0;
  function show() {
    lb.querySelector("img").src = set[at];
    lb.querySelector(".count").textContent = set.length > 1 ? (at + 1) + " / " + set.length : "";
    lb.querySelectorAll(".prev, .next").forEach(function (b) { b.style.display = set.length > 1 ? "" : "none"; });
  }
  function close() { if (lb) { lb.remove(); lb = null; document.body.style.overflow = ""; } }
  function step(d) { at = (at + d + set.length) % set.length; show(); }
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.ph");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); e.stopPropagation();
    var links = Array.prototype.slice.call(a.closest(".media").querySelectorAll("a.ph"));
    set = links.map(function (x) { return x.getAttribute("href"); });
    at = links.indexOf(a);
    lb = document.createElement("div");
    lb.className = "lb";
    lb.innerHTML = '<img alt=""><button type="button" class="x" aria-label="Close">✕</button><button type="button" class="prev" aria-label="Previous">‹</button><button type="button" class="next" aria-label="Next">›</button><div class="count"></div>';
    lb.addEventListener("click", function (ev) {
      if (ev.target.classList.contains("prev")) return step(-1);
      if (ev.target.classList.contains("next")) return step(1);
      close();
    });
    document.body.appendChild(lb);
    document.body.style.overflow = "hidden";
    show();
  }, true);
  document.addEventListener("keydown", function (e) {
    if (!lb) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });
  // Sortable lists (stance and person pages): Top / Newest, 30 at a time.
  document.querySelectorAll("[data-sortable]").forEach(function (box) {
    var list = box.querySelector(".list"), more = box.querySelector(".more");
    var cards = Array.prototype.slice.call(list.children), PAGE = 30, shown = PAGE;
    function paint() {
      cards.forEach(function (c, i) { c.classList.toggle("hidden", i >= shown); });
      if (more) more.classList.toggle("hidden", shown >= cards.length);
      window.acoReadMore(list);
    }
    box.querySelectorAll("[data-sort]").forEach(function (b) {
      b.addEventListener("click", function () {
        box.querySelectorAll("[data-sort]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        var key = b.dataset.sort;
        cards.sort(function (x, y) {
          if (key === "time") return x.dataset.time < y.dataset.time ? 1 : -1;
          return (+y.dataset.rank - +x.dataset.rank) || (+y.dataset.likes - +x.dataset.likes);
        });
        cards.forEach(function (c) { list.appendChild(c); });
        shown = PAGE; paint();
      });
    });
    if (more) more.addEventListener("click", function () { shown += PAGE; paint(); });
    paint();
  });
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
