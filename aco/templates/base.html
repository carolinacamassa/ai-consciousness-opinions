<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% block meta %}{% endblock %}
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}What people on X say about AI consciousness and the moral status of AI systems, sorted by stance. Built from the Community Archive.{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="{{ base }}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://pbs.twimg.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Poppins:ital,wght@0,300;0,400;1,300;1,400;1,500&display=swap" rel="stylesheet">
{% if umami_id %}<script defer src="{{ umami_script }}" data-website-id="{{ umami_id }}"></script>{% endif %}
<style>
:root {
  color-scheme: light;
  --bg: #faf9f6;
  --surface: #ffffff;
  --surface-2: #f3f2ee;
  --line: #e4e2dc;
  --text: #1b1b1d;
  --text-2: #4a4a50;
  --muted: #86868d;
  --link: #1f5fcc;
  --live: #1fa855;
  --display: "Poppins", system-ui, sans-serif;
  --title-w: 400;
  --text-w: 300;
  --emph-w: 500;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
a { color: inherit; text-decoration: none; }
img { display: block; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* Masthead */
.masthead { padding-top: 56px; padding-bottom: 36px; border-bottom: 1px solid var(--line); position: relative; }
.topnav { position: absolute; top: 22px; right: 24px; display: flex; gap: 18px; font-size: 14px; }
.topnav a { color: var(--text-2); }
.topnav a:hover { color: var(--text); }
.logo { display: inline-block; width: 0.78em; height: 0.78em; margin-right: 0.28em; vertical-align: -0.02em; }
.brand { font: var(--title-w) clamp(40px, 6vw, 64px)/1.02 var(--display); letter-spacing: -0.02em; margin: 0; }
.dek { font: var(--text-w) clamp(18px, 2.2vw, 22px)/1.4 var(--display); color: var(--text-2); margin: 14px 0 0; max-width: 40em; }
.dek a { color: var(--text); border-bottom: 1px solid var(--line); }
.dek a:hover { border-color: var(--text-2); }
.meta { font-size: 14px; color: var(--muted); margin: 16px 0 0; }
.meta .raw { font: 12.5px var(--mono); color: var(--text-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin-left: 8px; white-space: nowrap; }
.meta .raw:hover { border-color: var(--muted); color: var(--text); }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }

/* Sections */
section { padding: 40px 0; border-bottom: 1px solid var(--line); }
h2 { font: var(--title-w) clamp(28px, 3.4vw, 36px)/1.15 var(--display); letter-spacing: -0.015em; margin: 0 0 22px; display: flex; align-items: baseline; gap: 12px; }
h2 small { font: 12px var(--mono); color: var(--muted); letter-spacing: 0; }
.btn { font: 500 13px var(--sans); color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }

/* Tweet card */
.tw { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 18px; }
.tw + .tw { margin-top: 12px; }
.tw-row { display: flex; gap: 12px; }
.av { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--surface-2); object-fit: cover; }
.av-ph { display: grid; place-items: center; font: 500 16px var(--sans); color: var(--muted); }
.tw-body { min-width: 0; flex: 1; }
.tw-head { display: flex; align-items: baseline; gap: 6px; font-size: 14.5px; white-space: nowrap; }
.tw-head .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.tw-head .handle, .tw-head .time { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tw-head .time { flex: none; }
.stats { margin-left: auto; padding-left: 10px; display: flex; gap: 12px; color: var(--muted); font: 12.5px var(--mono); flex: none; }
.stats span { display: inline-flex; align-items: center; gap: 4px; }
.stats svg { width: 14px; height: 14px; }
.tw-text { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tw-text a { color: var(--link); }
.replying { font-size: 13px; color: var(--muted); margin-top: 1px; }
.media { display: grid; gap: 4px; margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); max-width: 520px; }
.media.n2, .media.n3, .media.n4 { grid-template-columns: 1fr 1fr; }
.media a { position: relative; display: block; background: var(--surface-2); }
.media img { width: 100%; height: 100%; max-height: 420px; object-fit: cover; }
.media.n1 img { height: auto; }
.media video { display: block; width: 100%; height: auto; max-height: 520px; background: #000; }
.media.n3 a:first-child { grid-row: span 2; }
.media .play { position: absolute; inset: 0; display: grid; place-items: center; }
.media .play::after { content: ""; width: 0; height: 0; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; filter: drop-shadow(0 1px 4px #0009); }
.quote { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.quote:hover { background: var(--surface-2); }
.quote .av { width: 20px; height: 20px; }
.quote .tw-head { align-items: center; font-size: 14px; }
.quote .tw-text { font-size: 14.5px; }
.quote .media { max-width: 360px; }
.parent { display: flex; gap: 12px; margin-bottom: 4px; opacity: .72; }
.parent .rail { width: 40px; flex: none; display: flex; flex-direction: column; align-items: center; }
.parent .rail::after { content: ""; flex: 1; width: 2px; background: var(--line); margin-top: 4px; min-height: 10px; }
.parent .tw-text { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }
.parent .media { max-width: 300px; }
.parent + .tw-row { padding-top: 2px; }
.tw-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.chip { font: 500 11.5px/1 var(--mono); padding: 4px 8px 4px 7px; border-radius: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
a.chip:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
.gist { font-style: italic; font-family: var(--display); font-size: 14.5px; color: var(--text-2); }
.xlink { margin-left: auto; color: var(--muted); white-space: nowrap; }
.xlink:hover { color: var(--text); }
.thread { margin-top: 10px; }
.thread summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; }
.thread summary::-webkit-details-marker { display: none; }
.thread summary::before { content: "▸ "; }
.thread[open] summary::before { content: "▾ "; }
.thread-tweet { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin-top: 10px; }
.thread-note { font-size: 13px; color: var(--muted); margin-top: 6px; }
.replies { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.replies summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; }
.replies summary::-webkit-details-marker { display: none; }
.replies summary::before { content: "▸ "; }
.replies[open] summary::before { content: "▾ "; }
.reply { display: flex; gap: 10px; padding: 10px 0 2px; font-size: 14px; }
.reply .av { width: 28px; height: 28px; }
.reply .tw-head { font-size: 13.5px; }
.reply .media { max-width: 260px; }

/* Compact variant for the live feed */
.tw.compact { padding: 12px 14px; border-radius: 12px; }
.tw.compact + .tw.compact { margin-top: 8px; }
.tw.compact .av { width: 32px; height: 32px; }
.tw.compact .tw-text { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.tw.compact .media { max-width: 240px; }
.tw.compact .media img { max-height: 160px; }
.tw.compact .tw-foot { margin-top: 8px; }
.tw-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; }
.tw.compact .stats { gap: 8px; }

.hidden { display: none !important; }
.lb { position: fixed; inset: 0; z-index: 100; background: rgba(20, 20, 22, .88); display: flex; align-items: center; justify-content: center; }
.lb img { max-width: calc(100vw - 120px); max-height: calc(100vh - 80px); object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px #0006; cursor: zoom-out; }
.lb button { position: absolute; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px; cursor: pointer; }
.lb button:hover { background: rgba(255,255,255,.24); }
.lb .x { top: 18px; right: 18px; }
.lb .prev { left: 18px; } .lb .next { right: 18px; }
.lb .count { position: absolute; bottom: 18px; color: #fff; font: 12.5px var(--mono); opacity: .8; }
@media (max-width: 640px) { .lb img { max-width: 100vw; max-height: calc(100vh - 120px); border-radius: 0; } .lb .prev, .lb .next { bottom: 18px; top: auto; } .lb .prev { left: 18px; } .lb .next { right: 18px; } }
.readmore { font: 500 13px var(--sans); color: var(--link); background: none; border: 0; padding: 4px 0 0; cursor: pointer; }
/* Full cards on model and reporter pages: clip only really long tweets. */
.list .tw:not(.compact) > .tw-row > .tw-body > .tw-text { display: -webkit-box; -webkit-line-clamp: 14; -webkit-box-orient: vertical; overflow: hidden; }
.tw.expanded .tw-text { -webkit-line-clamp: unset !important; display: block !important; }
.dbg { display: none; font: 500 11.5px/1.3 var(--mono); color: #8a5a00; background: #fff4d6; border: 1px solid #f0d58a; border-radius: 6px; padding: 3px 7px; }
.debug .dbg { display: inline-block; }
footer { padding: 36px 0 60px; color: var(--muted); font-size: 13px; }
footer a { color: var(--text-2); border-bottom: 1px solid var(--line); }
footer p { margin: 4px 0; }
{% block style %}{% endblock %}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .masthead { padding-top: 44px; padding-bottom: 26px; }
  .topnav { top: 14px; right: 16px; }
  section { padding: 30px 0; }
  .tw { padding: 14px; }
  .stats { gap: 8px; }
  .tw-head .handle { display: none; }
}
</style>
</head>
<body>
{% block body %}{% endblock %}
<footer class="wrap">
  <p><a href="{{ base }}about/">About</a> · <a href="{{ github }}" target="_blank" rel="noopener">GitHub</a> · <a href="{{ base }}llms.txt">llms.txt</a> · built on <a href="{{ upstream }}" target="_blank" rel="noopener">Model Behavior Reports</a> by Alexandre Variengien · data from the <a href="https://www.community-archive.org" target="_blank" rel="noopener">Community Archive</a></p>
</footer>
<script>
(function () {
  var now = Date.now();
  function ago(t) {
    var s = Math.max(0, (now - Date.parse(t)) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    var d = new Date(t), same = d.getFullYear() === new Date(now).getFullYear();
    return d.toLocaleDateString("en-US", same ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
  }
  document.querySelectorAll("time[datetime]").forEach(function (el) {
    el.textContent = el.dataset.long ? el.dataset.long.replace("% ago", ago(el.getAttribute("datetime")).replace(/^(\d+[mh])$/, "$1 ago").replace(/^([A-Z].*)$/, "on $1")) : ago(el.getAttribute("datetime"));
  });
  // "Read more" on any tweet whose text is clipped. Clipping can only be measured once
  // visible, so re-check when a <details> opens (e.g. a model card's top report).
  window.mbrReadMore = function (root) {
    (root || document).querySelectorAll(".tw:not(.expanded) > .tw-row > .tw-body > .tw-text").forEach(function (el) {
      if (el.nextElementSibling && el.nextElementSibling.classList.contains("readmore")) return;
      if (el.scrollHeight > el.clientHeight + 2) {
        var b = document.createElement("button");
        b.className = "readmore"; b.textContent = "Read more";
        b.addEventListener("click", function () { el.closest(".tw").classList.add("expanded"); b.remove(); });
        el.insertAdjacentElement("afterend", b);
      }
    });
  };
  window.mbrReadMore();
  document.addEventListener("toggle", function (e) { if (e.target.open) window.mbrReadMore(e.target); }, true);
  addEventListener("load", function () { window.mbrReadMore(); });
  // ?debug=1 shows grader scores; keep it on across internal links.
  if (/[?&]debug=1/.test(location.search)) {
    document.documentElement.classList.add("debug");
    document.querySelectorAll('a[href^="{{ base }}"]').forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href") + "?debug=1");
    });
  }
  // Avatars that no longer exist (changed profile picture): fall back to the initial.
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (img.tagName !== "IMG" || !img.classList.contains("av")) return;
    var ph = document.createElement("span");
    ph.className = img.className + " av-ph";
    ph.textContent = (img.dataset.initial || "?").toUpperCase();
    img.replaceWith(ph);
  }, true);
  // Lightbox: photos open over the page; arrows browse the other photos of the same tweet.
  var lb = null, set = [], at = 0;
  function show() {
    lb.querySelector("img").src = set[at];
    lb.querySelector(".count").textContent = set.length > 1 ? (at + 1) + " / " + set.length : "";
    lb.querySelectorAll(".prev, .next").forEach(function (b) { b.style.display = set.length > 1 ? "" : "none"; });
  }
  function close() { if (lb) { lb.remove(); lb = null; document.body.style.overflow = ""; } }
  function step(d) { at = (at + d + set.length) % set.length; show(); }
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a.ph");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); e.stopPropagation();
    var links = Array.prototype.slice.call(a.closest(".media").querySelectorAll("a.ph"));
    set = links.map(function (x) { return x.getAttribute("href"); });
    at = links.indexOf(a);
    lb = document.createElement("div");
    lb.className = "lb";
    lb.innerHTML = '<img alt=""><button class="x" aria-label="Close">✕</button><button class="prev" aria-label="Previous">‹</button><button class="next" aria-label="Next">›</button><div class="count"></div>';
    lb.addEventListener("click", function (ev) {
      if (ev.target.classList.contains("prev")) return step(-1);
      if (ev.target.classList.contains("next")) return step(1);
      close();
    });
    document.body.appendChild(lb);
    document.body.style.overflow = "hidden";
    show();
  }, true);
  document.addEventListener("keydown", function (e) {
    if (!lb) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });
  document.addEventListener("click", function (e) {
    var q = e.target.closest(".quote");
    if (q && !e.target.closest("a, video")) window.open(q.dataset.href, "_blank", "noopener");
  });
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
