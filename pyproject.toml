[project]
name = "ai-consciousness-opinions"
version = "0.1.0"
description = "What people on X say about AI consciousness and moral status, by stance, built from the Community Archive."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
aco = "aco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aco"]
